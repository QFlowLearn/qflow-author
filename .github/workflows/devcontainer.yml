name: Dev Container

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
      - '.env.example'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tools/**'
      - 'deploy/cloudflare/worker.entry.ts'
      - 'lib/http/virtual.d.ts'
      - 'vite.config.ts'
      - 'cloudflare.config.ts'
      - 'tests/local_development_test.ts'
      - 'tests/hono/local_preview.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.0
      - name: Create workspace and run its actual lifecycle
        # Compose does not grant access to the CLI-generated Dockerfile outside the build context.
        # Scope the upstream workaround to this isolated build: docker/compose#14285.
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: '0'
        run: npm exec --yes --package=@devcontainers/cli@0.90.0 -- devcontainer up --workspace-folder .
      - name: Check container configuration and built Worker browser behavior
        run: |
          npm exec --yes --package=@devcontainers/cli@0.90.0 -- devcontainer exec --workspace-folder . pnpm typecheck
          npm exec --yes --package=@devcontainers/cli@0.90.0 -- devcontainer exec --workspace-folder . pnpm build
          npm exec --yes --package=@devcontainers/cli@0.90.0 -- devcontainer exec --workspace-folder . pnpm test:qa -- --database=qflow_test tests/local_development_test.ts tests/hono/local_preview.test.ts tests/hono/runtime.test.ts tests/hono/auth_runtime.test.ts tests/hono/dns_runtime.test.ts
      - name: Stop workspace services
        if: always()
        run: docker compose --project-name "${PWD##*/}_devcontainer" -f .devcontainer/compose.yml down
