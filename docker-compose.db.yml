services:
  postgres:
    image: postgres:17-alpine
    container_name: qflow-postgres
    environment:
      POSTGRES_USER: qflow
      POSTGRES_PASSWORD: qflow
      POSTGRES_DB: qflow_local
    ports:
      - '5433:5432'
    volumes:
      - ./.volumes/postgres17:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qflow']
      interval: 5s
      timeout: 3s
      retries: 5
